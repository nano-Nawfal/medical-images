name: Build images.json

on:
  push:
    paths:
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.webp'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          echo "[" > images.json
          first=true
          # البحث عن الصور في المجلد الرئيسي والمجلدات الفرعية
          find . -type f \( -name "*.jpg" -o -name "*.jpeg" -o -name "*.png" -o -name "*.webp" \) | while read -r filepath; do
            # إزالة علامة النقطة والشرطة المائلة من بداية المسار (مثال: ./القلب/image1.jpg تصبح القلب/image1.jpg)
            cleanpath="${filepath#./}"
            
            # استخراج اسم المجلد كـ تصنيف (Category)
            category=$(dirname "$cleanpath")
            if [ "$category" = "." ]; then
              category="معلومات عامة"
            fi
            
            # استخراج اسم الملف لجعل العنوان افتراضياً منه (بدون اللاحقة)
            filename=$(basename "$cleanpath")
            title="${filename%.*}"
            
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> images.json
            fi
            
            echo "  {" >> images.json
            echo "    \"title\": \"$title\"," >> images.json
            echo "    \"category\": \"$category\"," >> images.json
            echo "    \"description\": \"معلومات طبية موثوقة ومفيدة حول $category.\"," >> images.json
            echo "    \"image\": \"https://raw.githubusercontent.com/nano-Nawfal/medical-images/main/$cleanpath\"" >> images.json
            echo "  }" >> images.json
          done
          echo "]" >> images.json

      - name: Commit images.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update images.json with categories automatically"
