name: Build images.json

on:
  push:
    paths:
      - "*.jpg"
      - "*.jpeg"
      - "*.png"
      - "*.webp"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate images.json
        run: |
          echo "[" > images.json
          first=true
          for f in *.{jpg,jpeg,png,webp}; do
            [ -f "$f" ] || continue
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> images.json
            fi

            name=$(basename "$f")

            cat >> images.json <<EOF
{
  "title": "$name",
  "description": "",
  "category": "",
  "image": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/$name"
}
EOF
          done
          echo "]" >> images.json

      - name: Commit images.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update images.json automatically"
